<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Heat risk triage{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="masthead">
  <h1>Heat risk triage</h1>
  <nav class="scenarios" aria-label="Forecast scenario">
    {% for s in scenarios %}
      <a href="/scenario/{{ s.scenario_id }}{% if crew_capacity %}?capacity={{ crew_capacity }}{% endif %}"
         class="scenario-link{% if s.scenario_id == scenario_id %} is-current{% endif %}"
         {% if s.scenario_id == scenario_id %}aria-current="page"{% endif %}>{{ s.label }}</a>
    {% endfor %}
    {# Sits with the scenarios because it is the one page that spans them. #}
    <a href="/decisions" class="scenario-link{% if request.url.path == '/decisions' %} is-current{% endif %}"
       {% if request.url.path == '/decisions' %}aria-current="page"{% endif %}>Decisions</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script src="/static/app.js" defer></script>
</body>
</html>
